<!DOCTYPE html>
<html lang="cs" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="google" content="notranslate" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300..700&family=Rum+Raisin&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <title>rsvp-kids</title>
  </head>
  <body class="notranslate">
    <!-- header -->
    <header class="header">
      <div class="header_container container">
        <div class="changeLanguage">
          <button class="lang-btn" data-lang="cs">CZ</button>
          <button class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
    </header>
    <!-- hero -->
    <main class="layout container">
      <section class="hero">
        <div class="scene">
          <div class="rainbow"></div>
          <div class="castle"></div>
          <div class="girl"></div>
          <div class="cloud cloud-back"></div>
          <div class="cloud cloud-right"></div>
          <div class="cloud cloud-left"></div>
        </div>
        <!-- invitation text -->
        <div class="invitation">
          <div class="title">
            <h2 data-i18n="invitation.title.inv"></h2>
            <h1 class="child" data-i18n="invitation.title.name"></h1>
            <span class="birthday" data-i18n="invitation.title.year"></span>
          </div>
          <div class="subtitle">
            <p class="placeText" data-i18n="invitation.subtitle.event"></p>
            <span class="dateTime" data-i18n="invitation.subtitle.time"></span>
            <span class="playroom" data-i18n="invitation.subtitle.place"></span>
            <p class="adress" data-i18n="invitation.subtitle.address"></p>
          </div>
        </div>
        <!-- info form -->
        <div class="wrapper_info">
          <p class="info" data-i18n="invitation.info" data-html></p>
          <a href="#next" class="scroll-down" aria-label="Scroll down">
            <svg viewBox="0 0 40 40" class="scroll-icon">
              <circle cx="20" cy="20" r="18" />
              <polyline points="12,17 20,25 28,17" />
            </svg>
          </a>
        </div>
      </section>

      <!-- form -->
      <form class="form" novalidate id="contactForm">
        <p class="form_label" data-i18n="form.fullName"></p>
        <label for="name" class="sr-only">first Name</label>
        <input
          type="text"
          id="name"
          name="name"
          placeholder="First Name"
          data-i18n-placeholder="form.firstName"
          required
        />

        <label for="surname" class="sr-only">Last Name</label>
        <input
          type="text"
          id="surname"
          name="surname"
          placeholder="Last Name"
          data-i18n-placeholder="form.lastName"
          required
        />

        <label for="email" class="sr-only">E-mail</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="E-mail"
          required
        />
        <div class="attendance">
          <p class="form_label" data-i18n="form.invite"></p>
          <label>
            <input type="radio" name="attendance" value="yes" />
            <p data-i18n="form.yes">I will attend</p>
          </label>

          <label>
            <input type="radio" name="attendance" value="no" />
            <p data-i18n="form.no">I can't come</p>
          </label>
        </div>

        <div class="numberOfPeople">
          <p class="form_label" data-i18n="form.howManyPeople"></p>
          <div class="wrapper_adultsKids">
            <div class="adults_kids">
              <label for="numberOfAdults" data-i18n="form.adults">Adults</label>
              <input type="number" id="numberOfAdults" name="Adults" required />
            </div>

            <div class="adults_kids">
              <label for="numberOfKids" data-i18n="form.children"
                >Children</label
              >
              <input type="number" id="numberOfKids" name="Kids" required />
            </div>
          </div>
        </div>

        <details class="messageForHost">
          <summary data-i18n="form.message"></summary>

          <textarea
            id="message"
            name="message"
            rows="4"
            placeholder="For example: I’ll arrive later..."
            data-i18n-placeholder="form.textPlaceholder"
          ></textarea>
        </details>

        <div class="submit">
          <div class="wrapper_agree">
            <label class="agree">
              <input type="checkbox" id="agree" name="consent" value="Agreed" />
              <p data-i18n="form.agree">
                *I agree to the processing of personal data.
              </p>
            </label>
          </div>

          <button
            id="submitBtn"
            type="submit"
            class="form_label btn--large"
            data-i18n="form.buttonSubmit"
          >
            Submit
          </button>

          <div id="formMessages">
            <p id="errorMessage" class="hidden"></p>
            <p id="successMessage" class="hidden"></p>
          </div>
        </div>
      </form>

      <section class="gift-section">
        <div class="wrapper_form-label">
          <p class="form_label" data-i18n="form.giftIns"></p>

          <button
            type="button"
            class="btn--medium"
            id="showGiftTips"
            data-i18n="form.giftShow"
          >
            Show tips
          </button>
        </div>

        <div class="gift-card hidden" id="giftCard">
          <h3 class="giftTitle" id="giftTitle"></h3>
          <img id="giftImage" src="" alt="" />

          <div class="buttons_tip">
            <button
              type="button"
              class="btn--small"
              id="previousGift"
              data-i18n="form.giftPrevious"
            >
              previous tip
            </button>

            <button
              type="button"
              class="btn--small"
              id="nextGift"
              data-i18n="form.giftNext"
            >
              Next tip
            </button>
          </div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <ul class="socials_list">
        <li>
          <a href="mailto:zenia.codes@gmail.com" aria-label="Email">
            <i class="fa-solid fa-envelope"></i>
          </a>
        </li>
        <li>
          <a
            href="https://www.linkedin.com/in/zde%C5%88ka-be%C5%A5%C3%A1kov%C3%A1-a7505b372/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <i class="fa-brands fa-linkedin-in" aria-hidden="true"></i>
          </a>
        </li>
        <li>
          <a
            href="https://github.com/zenia-codes"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="LinkedIn"
          >
            <i class="fa-brands fa-github"></i>
          </a>
        </li>
        <li>
          <a
            href="https://wa.me/420775500744"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="WhatsApp"
          >
            <i class="fa-brands fa-whatsapp" aria-hidden="true"></i>
          </a>
        </li>
      </ul>
      <p class="footer__copyright">
        © 2026 Designed & Developed by Zdeňka Beťáková
      </p>
    </footer>

    <div class="confetti-container" id="confetti"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
